<div class="form-overlay"></div>

<!-- REGISTER (Librarian) -->
<div class="box">
    <h2>Signup</h2>

    <form id="form" class="login-form" onsubmit="registerUser(event)">

        <input type="text" id="library_name" placeholder="Library Name" required>

        <input type="text" id="name" placeholder="Username" required>
        <span id="nameError"></span>

        <input type="email" id="email" placeholder="E-mail" required>
        <span id="mailError"></span>

        <input type="password" id="password" placeholder="Password" required>
        <span id="passError"></span>

        <input type="password" id="confirmpass" placeholder="Confirm Password" required>
        <span id="confirmError"></span>

        <label>
            <input type="checkbox" id="showpass">
            Show Password
        </label>

        <button type="submit">Register</button>

    </form>
</div>


<!-- STUDENT LOGIN -->
<div class="box1">

    <h2>Student Login</h2>

    <form class="login-form" onsubmit="loginStudent(event)">

        <input
            type="text"
            id="student-code"
            placeholder="Library Code"
            required
        >

        <input
            type="email"
            id="student-email"
            placeholder="E-mail"
            required
        >

        <input
            type="password"
            id="student-password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>
