<div class="form-overlay"></div>


<!-- =====================================================
     REGISTER - LIBRARIAN
===================================================== -->

<div class="box">

    <h2>Signup</h2>

    <form id="form" class="login-form" onsubmit="registerUser(event)">

        <div class="signup-grid">

            <!-- Library Name -->
            <div class="form-group">
                <input
                    type="text"
                    id="library_name"
                    placeholder="Library Name"
                    required
                >
            </div>


            <!-- Username -->
            <div class="form-group">

                <input
                    type="text"
                    id="name"
                    placeholder="Username"
                    required
                >

                <span id="nameError"></span>

            </div>


            <!-- Email -->
            <div class="form-group">

                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    required
                >

                <span id="mailError"></span>

            </div>


            <!-- City -->
            <div class="form-group">

                <input
                    type="text"
                    id="city"
                    placeholder="City"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <span id="passError"></span>

            </div>


            <!-- Confirm Password -->
            <div class="form-group">

                <input
                    type="password"
                    id="confirmpass"
                    placeholder="Confirm Password"
                    required
                >

                <span id="confirmError"></span>

            </div>

        </div>


        <!-- Library Address -->

        <div class="form-group full-width">

            <input
                type="text"
                id="address"
                placeholder="Library Address"
                required
            >

        </div>


        <!-- Location -->

        <label class="location-title">
            <i class="fa-solid fa-location-dot"></i>
            Select Library Location
        </label>


        <div id="map"></div>


        <!-- Hidden Coordinates -->

        <input type="hidden" id="lat">
        <input type="hidden" id="lon">


        <!-- Show Password -->

        <label class="show-password">

            <input
                type="checkbox"
                id="showpass"
            >

            <span>Show Password</span>

        </label>


        <!-- Register Button -->

        <button type="submit" class="form-btn">
            Register
        </button>

    </form>

</div>
